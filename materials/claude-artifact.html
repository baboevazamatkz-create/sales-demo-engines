<title>Учёт материалов</title>
<meta name="theme-color" content="#111111">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #111111; --muted: #7a7a76;
    --line: #e6e6e2; --accent: #111111; --on-accent: #ffffff; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f0f0f; --card: #1a1a1a; --text: #f2f2f0; --muted: #8d8d88;
      --line: #2a2a2a; --accent: #f2f2f0; --on-accent: #111111; --danger: #ff6b5b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f0f0f; --card: #1a1a1a; --text: #f2f2f0; --muted: #8d8d88;
    --line: #2a2a2a; --accent: #f2f2f0; --on-accent: #111111; --danger: #ff6b5b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px; margin: 0 auto; min-height: 100%;
    padding-inline: 16px; padding-block: 0 120px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  header { display: flex; align-items: center; gap: 8px; padding: 20px 0 12px; }
  header h1 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -0.01em; }
  .icon-btn {
    height: 40px; min-width: 40px; padding: 0 12px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 8px; font-size: 14px; color: var(--muted); }
  .tabs button.on { background: var(--bg); color: var(--text); font-weight: 600; }

  .search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); margin-bottom: 12px; outline: none; }

  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .name { flex: 1; min-width: 0; }
  .row .name div:first-child { overflow-wrap: anywhere; }
  .row .sub { font-size: 13px; color: var(--muted); }
  .row .qty { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .del { color: var(--muted); padding: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .total { font-size: 13px; color: var(--muted); padding: 10px 4px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .dock-inner { max-width: 528px; margin: 0 auto; display: flex; gap: 8px; }
  .primary { flex: 1; height: 56px; border-radius: 16px; background: var(--accent); color: var(--on-accent);
    font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .primary:disabled { opacity: .5; }
  .primary svg { width: 22px; height: 22px; }
  .secondary { height: 56px; width: 56px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; }
  .secondary svg { width: 22px; height: 22px; }

  dialog { border: 0; padding: 0; width: 100%; max-width: 560px; margin: auto auto 0; background: transparent; color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .sheet { background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto; }
  .sheet h2 { margin: 0 0 14px; font-size: 19px; }
  .photo { width: 100%; max-height: 200px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; background: var(--card); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .item.low { border-color: #e0a800; }
  .field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); outline: none; }
  .field:focus { border-color: var(--text); }
  label.cap { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .qline { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .stepper button { width: 44px; height: 44px; font-size: 22px; }
  .stepper input { width: 70px; text-align: center; border: 0; background: none; outline: none; font-weight: 600; font-size: 17px; }
  .qline select { flex: 1; height: 46px; }
  .item-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .ghost { flex: 0 0 auto; height: 56px; padding: 0 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }

  .spinner { width: 22px; height: 22px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); color: #fff; }
  .status { font-size: 12px; color: var(--muted); padding: 0 4px 8px; }
  .ask p { margin: 0 0 6px; }
  .link { color: var(--muted); text-decoration: underline; font-size: 14px; }
</style><header>
  <h1>Материалы</h1>
  <button class="icon-btn" id="exportBtn" title="Скачать Excel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Excel
  </button>
  <button class="icon-btn" id="settingsBtn" title="База" aria-label="База">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="tabs">
  <button class="on" data-tab="stock">Остатки</button>
  <button data-tab="log">Журнал</button>
</div>
<input class="search" id="search" type="search" placeholder="Поиск">
<div class="status" id="status"></div>
<div id="view"></div>

<div class="dock">
  <div class="dock-inner">
    <button class="primary" id="scanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>Сканировать</span>
    </button>
    <button class="secondary" id="manualBtn" title="Добавить вручную">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</div>

<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="importFile" accept=".xlsx,.xls" hidden>

<dialog id="confirmDlg">
  <form method="dialog" class="sheet" id="confirmForm">
    <h2 id="confirmTitle">Добавить в базу</h2>
    <img class="photo" id="photo" alt="" hidden>
    <div id="items"></div>
    <button type="button" class="link" id="addRowBtn">+ ещё позиция</button>
    <div class="actions">
      <button type="button" class="ghost" id="cancelBtn">Отмена</button>
      <button type="submit" class="primary">Подтвердить</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg">
  <form method="dialog" class="sheet" id="settingsForm">
    <h2>База</h2>
    <p class="hint" id="storeHint"></p>
    <div class="actions">
      <button type="button" class="ghost" id="importBtn" style="flex:1">Загрузить из Excel</button>
      <button type="button" class="ghost" id="clearBtn" style="flex:1;color:var(--danger)">Очистить</button>
    </div>
    <div class="actions">
      <button type="submit" class="primary">Готово</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <form method="dialog" class="sheet ask" id="askForm">
    <h2 id="askTitle">Подтвердите</h2>
    <p class="hint" id="askText"></p>
    <div class="actions">
      <button type="button" class="ghost" id="askNo" style="flex:1">Отмена</button>
      <button type="submit" class="primary" id="askYes">Да</button>
    </div>
  </form>
</dialog>

<datalist id="names"></datalist>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';

// Журнал поступлений -- единственные данные. Остатки считаются из него.
// Хранится в базе страницы (видно с любого устройства); если база
// недоступна -- в браузере.
const LOCAL_KEY = 'materials.log.v1';
const UNITS = ['шт', 'кг', 'г', 'т', 'л', 'мл', 'м', 'м²', 'м³', 'уп', 'рул', 'меш', 'лист'];

const $ = (id) => document.getElementById(id);

let log = loadLocal();
let tab = 'stock';
let db = null;
let sample = null;
let downloads = null;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; }
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(log)); } catch { /* нет хранилища */ }
}
const newId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// --- возможности страницы ------------------------------------------------

(async function connect() {
  if (!window.claude) { setStatus(); return; }
  [db, sample, downloads] = await Promise.all(
    ['db', 'sample', 'downloads'].map((n) => window.claude.use(n).catch(() => null)),
  );
  if (db) {
    db.collection('entries').orderBy('date').onSnapshot(
      (snap) => {
        log = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        render();
      },
      () => { db = null; log = loadLocal(); setStatus(); render(); },
    );
  }
  setStatus();
})();

function setStatus() {
  $('status').textContent = db ? '' : 'База хранится только в этом браузере';
  $('storeHint').textContent = db
    ? 'База хранится на странице и доступна с любого устройства, где открыта эта ссылка.'
    : 'База хранится только в этом браузере. Периодически скачивайте Excel.';
}

async function addEntries(entries) {
  const now = new Date().toISOString();
  const rows = entries.map((e) => ({ id: newId(), date: now, ...e }));
  if (db) {
    for (const { id, ...body } of rows) await db.collection('entries').doc(id).set(body);
  } else {
    log.push(...rows);
    saveLocal();
    render();
  }
}

async function removeEntry(id) {
  if (db) {
    await db.doc('entries/' + id).delete();
  } else {
    log = log.filter((e) => e.id !== id);
    saveLocal();
    render();
  }
}

async function replaceAll(rows) {
  if (db) {
    for (const e of log) await db.doc('entries/' + e.id).delete();
    for (const { id, ...body } of rows) await db.collection('entries').doc(id).set(body);
  } else {
    log = rows;
    saveLocal();
    render();
  }
}

// --- данные --------------------------------------------------------------

const keyOf = (name, unit) => `${name.trim().toLowerCase().replace(/\s+/g, ' ')}|${unit}`;
const fmt = (n) => Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const fmtDate = (iso) => new Date(iso).toLocaleString('ru-RU', {
  day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
});

function stock() {
  const map = new Map();
  for (const e of log) {
    const k = keyOf(e.name, e.unit);
    const s = map.get(k) || { name: e.name, unit: e.unit, package: '', qty: 0, last: e.date };
    s.qty += Number(e.qty) || 0;
    if (e.package) s.package = e.package;
    if (e.date >= s.last) s.last = e.date;
    map.set(k, s);
  }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

// --- отрисовка ----------------------------------------------------------

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const match = (name) => !q || name.toLowerCase().includes(q);
  const view = $('view');

  $('names').innerHTML = stock().map((s) => `<option value="${esc(s.name)}">`).join('');

  if (tab === 'stock') {
    const rows = stock().filter((s) => match(s.name));
    if (!rows.length) {
      view.innerHTML = `<div class="empty">${log.length ? 'Ничего не найдено' : 'База пуста.<br>Нажмите «Сканировать» и сфотографируйте материал.'}</div>`;
      return;
    }
    view.innerHTML = `<div class="list">${rows.map((s) => `
      <div class="row">
        <div class="name"><div>${esc(s.name)}</div>
          <div class="sub">${s.package ? esc(s.package) + ' · ' : ''}${fmtDate(s.last)}</div></div>
        <div class="qty">${fmt(s.qty)} ${esc(s.unit)}</div>
      </div>`).join('')}</div>
      <div class="total">Позиций: ${rows.length}</div>`;
  } else {
    const rows = log.filter((e) => match(e.name)).slice().reverse();
    if (!rows.length) {
      view.innerHTML = `<div class="empty">${log.length ? 'Ничего не найдено' : 'Журнал пуст'}</div>`;
      return;
    }
    view.innerHTML = `<div class="list">${rows.map((e) => `
      <div class="row">
        <div class="name"><div>${esc(e.name)}</div><div class="sub">${fmtDate(e.date)}</div></div>
        <div class="qty">+${fmt(e.qty)} ${esc(e.unit)}</div>
        <button class="del" data-del="${esc(e.id)}" title="Удалить запись" aria-label="Удалить запись">✕</button>
      </div>`).join('')}</div>`;
  }
}

$('view').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-del]');
  if (!btn) return;
  const entry = log.find((e) => e.id === btn.dataset.del);
  if (!entry) return;
  if (!await ask('Удалить запись?', `${entry.name} +${fmt(entry.qty)} ${entry.unit}`, 'Удалить')) return;
  try { await removeEntry(entry.id); } catch { toast('Не удалось удалить, попробуйте ещё раз', true); }
});

document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));
$('search').addEventListener('input', render);

let toastTimer;
function toast(text, isError = false) {
  const t = $('toast');
  t.textContent = text;
  t.classList.toggle('err', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 4000 : 2000);
}

// Окно «Да / Отмена» внутри страницы: системные confirm() здесь не работают.
function ask(title, text, yes = 'Да') {
  $('askTitle').textContent = title;
  $('askText').textContent = text;
  $('askYes').textContent = yes;
  $('askDlg').showModal();
  return new Promise((resolve) => {
    const done = (v) => () => { cleanup(); $('askDlg').close(); resolve(v); };
    const onYes = (ev) => { ev.preventDefault(); done(true)(); };
    const onNo = done(false);
    const onClose = () => { cleanup(); resolve(false); };
    function cleanup() {
      $('askForm').removeEventListener('submit', onYes);
      $('askNo').removeEventListener('click', onNo);
      $('askDlg').removeEventListener('close', onClose);
    }
    $('askForm').addEventListener('submit', onYes);
    $('askNo').addEventListener('click', onNo);
    $('askDlg').addEventListener('close', onClose);
  });
}

// --- подтверждение ------------------------------------------------------

function itemCard(item = { name: '', quantity: 1, unit: 'шт', package: '', confidence: 1 }) {
  const div = document.createElement('div');
  const low = item.confidence < 0.6;
  div.className = 'item' + (low ? ' low' : '');
  div.innerHTML = `
    <div class="item-head"><span>${low ? 'Проверьте название — прочитано неуверенно' : 'Материал'}</span>
      <button type="button" class="del" title="Убрать" aria-label="Убрать позицию">✕</button></div>
    <input class="field" name="name" list="names" required placeholder="Название" autocomplete="off">
    <div class="qline">
      <div class="stepper">
        <button type="button" data-step="-1" aria-label="Меньше">−</button>
        <input name="qty" type="number" inputmode="decimal" min="0" step="any" required aria-label="Количество">
        <button type="button" data-step="1" aria-label="Больше">+</button>
      </div>
      <select class="field" name="unit" aria-label="Единица">${UNITS.map((u) => `<option>${u}</option>`).join('')}</select>
    </div>
    <input class="field" name="package" placeholder="Фасовка, напр. 50 кг (необязательно)" style="margin-top:8px">`;
  div.querySelector('[name=name]').value = item.name;
  div.querySelector('[name=qty]').value = item.quantity;
  div.querySelector('[name=unit]').value = UNITS.includes(item.unit) ? item.unit : 'шт';
  div.querySelector('[name=package]').value = item.package || '';
  div.querySelector('.item-head .del').addEventListener('click', () => div.remove());
  div.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
    const input = div.querySelector('[name=qty]');
    input.value = Math.max(0, (Number(input.value) || 0) + Number(b.dataset.step));
  }));
  return div;
}

let photoUrl = null;
function openConfirm(items, url) {
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = url;
  $('items').replaceChildren(...items.map((i) => itemCard(i)));
  $('photo').hidden = !url;
  if (url) $('photo').src = url;
  $('confirmTitle').textContent = url ? 'Распознано' : 'Добавить вручную';
  $('confirmDlg').showModal();
}

$('addRowBtn').addEventListener('click', () => $('items').append(itemCard()));
$('cancelBtn').addEventListener('click', () => $('confirmDlg').close());
$('manualBtn').addEventListener('click', () => openConfirm([undefined], null));

$('confirmForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const entries = [...$('items').querySelectorAll('.item')].map((div) => ({
    name: div.querySelector('[name=name]').value.replace(/\s+/g, ' ').trim(),
    qty: Number(div.querySelector('[name=qty]').value),
    unit: div.querySelector('[name=unit]').value,
    package: div.querySelector('[name=package]').value.trim(),
  })).filter((e) => e.name && e.qty > 0);
  if (!entries.length) {
    toast('Нет позиций с названием и количеством', true);
    return;
  }
  $('confirmDlg').close();
  try {
    await addEntries(entries);
    toast(entries.length === 1 ? `Добавлено: ${entries[0].name}` : `Добавлено позиций: ${entries.length}`);
  } catch {
    toast('Не удалось сохранить, попробуйте ещё раз', true);
  }
});

// --- сканирование через Claude ------------------------------------------

const PROMPT = [
  'Ты помогаешь вести складской учёт строительных и хозяйственных материалов.',
  'На фото упаковка, этикетка, бирка или сам материал. Прочитай надписи и определи, что это.',
  '',
  'Верни ТОЛЬКО JSON-массив позиций, без пояснений:',
  '[{"name": "Цемент М500 Д0", "quantity": 3, "unit": "меш", "package": "50 кг", "confidence": 0.95}]',
  '',
  '- name: название, как запишет кладовщик: тип, марка, ключевой размер. Производителя — если крупно на упаковке. Без штрихкодов и рекламы. До 80 символов, по-русски (бренды и марки как есть).',
  '- quantity: сколько упаковок или штук видно на фото. Одна упаковка — 1.',
  `- unit: одно из ${UNITS.join(', ')}. Мешки — меш, коробки и пачки — уп, рулоны — рул, листы — лист, предметы — шт. Вес одной упаковки сюда не относится.`,
  '- package: фасовка одной упаковки, если написана («50 кг», «10 л»), иначе "".',
  '- confidence: уверенность в названии от 0 до 1.',
  'Одинаковые упаковки — одна позиция с количеством. Разные материалы — разные позиции.',
  'Если надпись не читается — опиши материал по виду с низкой уверенностью. Ничего не выдумывай.',
  'Если материала на фото нет — верни [].',
].join('\n');

function cleanItems(raw) {
  const out = [];
  for (const item of Array.isArray(raw) ? raw : []) {
    const name = String(item?.name ?? '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!name) continue;
    const quantity = Math.abs(Number(item?.quantity));
    const confidence = Number(item?.confidence);
    out.push({
      name,
      quantity: Number.isFinite(quantity) && quantity > 0 ? Math.round(quantity * 1000) / 1000 : 1,
      unit: UNITS.includes(item?.unit) ? item.unit : 'шт',
      package: String(item?.package ?? '').trim().slice(0, 30),
      confidence: Number.isFinite(confidence) ? confidence : 1,
    });
    if (out.length >= 20) break;
  }
  return out;
}

const SAMPLE_ERRORS = {
  not_granted: 'Распознавание не разрешено. Добавьте материал вручную',
  sampling_disabled: 'Claude недоступен для этого аккаунта',
  images_unavailable: 'Здесь нельзя отправлять фото — добавьте вручную',
  image_rejected: 'Фото не подошло. Попробуйте другой снимок',
  rate_limited: 'Слишком много запросов. Подождите немного',
  session_expired: 'Войдите в claude.ai заново',
  invalid_json: 'Ответ не разобран. Попробуйте ещё раз',
};

$('scanBtn').addEventListener('click', () => {
  if (!sample) {
    toast('Распознавание здесь недоступно — добавьте вручную', true);
    openConfirm([undefined], null);
    return;
  }
  $('camera').value = '';
  $('camera').click();
});

$('camera').addEventListener('change', async () => {
  const file = $('camera').files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  setBusy(true);
  try {
    const raw = await sample.json(PROMPT, { images: [file], cache: false });
    const items = cleanItems(raw);
    if (!items.length) toast('Материал не распознан — введите вручную', true);
    openConfirm(items.length ? items : [undefined], url);
  } catch (err) {
    URL.revokeObjectURL(url);
    if (err?.code !== 'cancelled') {
      toast(SAMPLE_ERRORS[err?.code] || 'Не удалось распознать. Попробуйте ещё раз', true);
    }
  } finally {
    setBusy(false);
  }
});

const scanIcon = $('scanBtn').querySelector('svg');
function setBusy(busy) {
  const btn = $('scanBtn');
  btn.disabled = busy;
  btn.querySelector('span').textContent = busy ? 'Распознаю…' : 'Сканировать';
  btn.querySelector('svg, .spinner').replaceWith(busy
    ? Object.assign(document.createElement('div'), { className: 'spinner' })
    : scanIcon);
}

// --- Excel --------------------------------------------------------------

$('exportBtn').addEventListener('click', async () => {
  if (!window.XLSX) return toast('Excel-модуль не загрузился', true);
  if (!log.length) return toast('База пуста', true);
  const wb = XLSX.utils.book_new();
  const opts = { cellDates: true, dateNF: 'dd.mm.yyyy hh:mm' };
  const s1 = XLSX.utils.json_to_sheet(stock().map((s) => ({
    'Материал': s.name, 'Количество': s.qty, 'Ед.': s.unit, 'Фасовка': s.package,
    'Последнее поступление': new Date(s.last),
  })), opts);
  const s2 = XLSX.utils.json_to_sheet(log.map((e) => ({
    'Дата': new Date(e.date), 'Материал': e.name, 'Количество': e.qty, 'Ед.': e.unit, 'Фасовка': e.package || '',
  })), opts);
  s1['!cols'] = [{ wch: 40 }, { wch: 12 }, { wch: 6 }, { wch: 12 }, { wch: 20 }];
  s2['!cols'] = [{ wch: 18 }, { wch: 40 }, { wch: 12 }, { wch: 6 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, s1, 'Остатки');
  XLSX.utils.book_append_sheet(wb, s2, 'Журнал');
  const filename = `materials-${new Date().toISOString().slice(0, 10)}.xlsx`;
  if (!downloads) return XLSX.writeFile(wb, filename);
  const data = new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })]);
  try {
    await downloads.save({ filename, data });
    toast('Excel сохранён');
  } catch (err) {
    if (err?.code !== 'declined') toast('Не удалось сохранить файл', true);
  }
});

$('importBtn').addEventListener('click', () => {
  if (!window.XLSX) return toast('Excel-модуль не загрузился', true);
  $('importFile').value = '';
  $('importFile').click();
});

$('importFile').addEventListener('change', async () => {
  const file = $('importFile').files[0];
  if (!file) return;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const sheet = wb.Sheets['Журнал'];
    if (!sheet) throw new Error('В файле нет листа «Журнал»');
    const rows = XLSX.utils.sheet_to_json(sheet).map((r) => ({
      id: newId(),
      date: (r['Дата'] instanceof Date ? r['Дата'] : new Date()).toISOString(),
      name: String(r['Материал'] ?? '').trim(),
      qty: Number(r['Количество']),
      unit: UNITS.includes(r['Ед.']) ? r['Ед.'] : 'шт',
      package: String(r['Фасовка'] ?? '').trim(),
    })).filter((e) => e.name && Number.isFinite(e.qty));
    $('settingsDlg').close();
    if (!await ask('Заменить базу?', `Сейчас записей: ${log.length}. В файле: ${rows.length}.`, 'Заменить')) return;
    await replaceAll(rows);
    toast('База загружена');
  } catch (err) {
    toast(err?.message || 'Не удалось прочитать файл', true);
  }
});

// --- меню базы ----------------------------------------------------------

$('settingsBtn').addEventListener('click', () => $('settingsDlg').showModal());
$('clearBtn').addEventListener('click', async () => {
  $('settingsDlg').close();
  if (!log.length) return;
  if (!await ask('Удалить все записи?', 'Сначала лучше скачать Excel.', 'Удалить всё')) return;
  try { await replaceAll([]); } catch { toast('Не удалось очистить', true); }
});
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (ev) => {
  if (ev.target === d) d.close();
}));

render();
setStatus();
</script>
