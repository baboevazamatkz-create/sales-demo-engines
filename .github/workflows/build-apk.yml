name: Build APK (craft_post)

on:
  workflow_dispatch:
  push:
    paths: ['craft_post/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craft_post
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Загрузка Gradle/NDK иногда обрывается — повторяем до 3 раз.
      - run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Сборка не удалась (попытка $i), повтор"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-apk
          path: craft_post/build/app/outputs/flutter-apk/app-release.apk
