# Публикует демо на GitHub Pages.
#
# Собирается не одна страница, а несколько: галерея в корне (для себя) и
# отдельная страница под каждого клиента в своей папке. Клиенту уходит
# ссылка вида /sales-demo-engines/<клиент>/ — она открывается сразу в его
# приложение, без галереи и без следов других клиентов.
#
# Разовая настройка руками: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /sales-demo-engines

jobs:
  build:
    name: Собрать галерею и страницы клиентов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Собрать галерею
        env:
          VITE_BASE: ${{ env.BASE_PATH }}/
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build
          rm -rf site && mkdir -p site
          cp -r dist/* site/

      - name: Собрать страницу под каждого клиента
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -e
          for dir in src/clients/*/; do
            client=$(basename "$dir")
            [ "$client" = "_templates" ] && continue

            echo "--- Собираю $client"
            VITE_CLIENT="$client" VITE_BASE="$BASE_PATH/$client/" npx vite build --outDir "dist-$client"
            mkdir -p "site/$client"
            cp -r "dist-$client"/* "site/$client/"
          done

          echo "Содержимое сайта:"
          ls -1 site

      - name: Добавить учёт материалов
        run: |
          mkdir -p site/materials
          cp materials/index.html materials/manifest.webmanifest materials/icon.svg materials/xlsx.full.min.js site/materials/

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
