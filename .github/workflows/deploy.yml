# Publishes the demo gallery to GitHub Pages.
#
# One-time setup, done by hand: Settings -> Pages -> Source must be set to
# "GitHub Actions". The default GITHUB_TOKEN cannot enable the Pages site
# itself, so there's no point trying to automate that step.
name: Deploy web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages serves a project site at /<repo>/, so the base path has to
      # match or every asset request 404s.
      - name: Build gallery
        env:
          VITE_BASE: /sales-demo-engines/
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
