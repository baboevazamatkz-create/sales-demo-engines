name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client id to build a standalone (gallery-free) bundle + debug APK for'
        default: 'polyn-cafe'
        required: false

jobs:
  build-web:
    name: Build web (gallery + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build gallery bundle
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-gallery-dist
          path: dist
          if-no-files-found: error

  build-client-android:
    name: Build one client's debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone bundle for one client
        env:
          CLIENT_ID: ${{ inputs.client_id || 'polyn-cafe' }}
        run: node scripts/build-client.mjs --id "$CLIENT_ID"

      - name: Add Android platform
        env:
          CLIENT_ID: ${{ inputs.client_id || 'polyn-cafe' }}
        run: |
          cp -r "dist-clients/$CLIENT_ID" dist
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
